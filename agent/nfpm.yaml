# nfpm packaging config for the Prompt Gate Go agent.
#
# Build with:
#   cd agent
#   make build
#   nfpm package --packager deb --config nfpm.yaml --target dist/
#
# Requires `nfpm` (https://nfpm.goreleaser.com/) on the build host.

name: "prompt-gate-agent"
arch: "amd64"
platform: "linux"
version: "${SECURE_EDGE_VERSION}"
section: "net"
priority: "optional"
maintainer: "Prompt Gate Maintainers <maintainers@example.invalid>"
description: |
  Prompt Gate — privacy-first, on-device DNS blocker and DLP agent. Blocks
  unauthorized AI tools at the DNS layer and inspects content sent to
  approved AI tools through a layered DLP pipeline. No URLs, domains, IPs,
  or DLP match content are ever written to disk.
vendor: "Prompt Gate"
homepage: "https://github.com/ShieldNet-360/prompt-gate"
license: "MIT"

depends:
  - libc6

contents:
  - src: ./prompt-gate-agent
    dst: /usr/bin/prompt-gate-agent
    file_info:
      mode: 0755

  - src: ../config.yaml
    dst: /etc/prompt-gate/config.yaml
    type: config|noreplace
    file_info:
      mode: 0644

  - src: ../rules/
    dst: /etc/prompt-gate/rules/
    file_info:
      mode: 0644

  - src: ../scripts/linux/prompt-gate.service
    dst: /lib/systemd/system/prompt-gate.service
    file_info:
      mode: 0644

  - src: ../scripts/linux/configure-dns.sh
    dst: /usr/share/prompt-gate/configure-dns.sh
    file_info:
      mode: 0755

scripts:
  postinstall: ./scripts/postinstall.sh
  preremove:   ./scripts/preremove.sh
