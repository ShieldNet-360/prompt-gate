appId: com.shieldnet360.promptgate
productName: Prompt Gate
directories:
  output: release
# electron-builder auto-converts icon.png → .icns (macOS) and .ico (Windows).
# The source PNG must be at least 512x512.
icon: resources/icon.png
files:
  - dist/**/*
  - package.json
  - "resources/*.png"
  - "!resources/*.svg"
asarUnpack:
  - "resources/icon.png"
  - "resources/tray-*.png"
# Bundle the Go agent binary + macOS proxy-helper + rules alongside the
# .app. The release workflow builds these into electron/resources/{bin,rules}
# before invoking electron-builder. They land at <app>/Contents/Resources/
# resources/{bin,rules} (macOS) — the exact paths agentBinaryPath() and
# rulesDirPath() probe in main.ts.
extraResources:
  - from: resources/bin
    to: resources/bin
    filter:
      - "**/*"
  - from: resources/rules
    to: resources/rules
    filter:
      - "**/*"
mac:
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.inherit.plist
  target:
    - dmg
dmg:
  title: Prompt Gate
  icon: resources/icon.png
  format: ULFO
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  executableName: prompt-gate
  target:
    - deb
    - rpm
    - AppImage
  category: Utility
  icon: resources/icon.png
  synopsis: Privacy-first AI DLP agent
  description: >
    Prompt Gate blocks unauthorized AI tools at the DNS layer and inspects
    content sent to approved AI tools through a layered DLP pipeline.
  desktop:
    Name: Prompt Gate
    Comment: Privacy-first AI DLP agent
    Categories: Utility;Security;Network;
    StartupWMClass: prompt-gate
    StartupNotify: "true"
    Terminal: "false"
deb:
  depends:
    - libc6
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
  afterInstall: scripts/postinstall.sh
  afterRemove: scripts/preremove.sh
win:
  target:
    - msi
    - zip
  icon: resources/icon.png
msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Prompt Gate
  runAfterFinish: true
# Publishing is handled by the release workflow (softprops/action-gh-release).
# Do NOT add a publish block here — electron-builder would attempt to upload
# on tagged builds and fail when GH_TOKEN is unavailable.
