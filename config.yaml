# Prompt Gate agent configuration

upstream_dns: "8.8.8.8:53"
dns_listen: "127.0.0.1:15353"
api_listen: "127.0.0.1:9191"
proxy_listen: "127.0.0.1:8443"

db_path: "prompt-gate.db"

rule_paths:
  - rules/ai_chat_blocked.txt
  - rules/ai_code_blocked.txt
  - rules/ai_chat_dlp.txt
  - rules/ai_allowed.txt
  - rules/phishing.txt
  - rules/social.txt

dlp_patterns: rules/dlp_patterns.json
dlp_exclusions: rules/dlp_exclusions.json

proxy_enabled: false
# When the MITM proxy is on it verifies upstream TLS certificates against
# the system trust store. Behind a corporate TLS-inspecting proxy, or for
# internal/self-signed upstreams, point this at a PEM file of extra CA
# certs to trust (added alongside the system store). Verification stays on.
# proxy_upstream_ca_bundle: "/etc/prompt-gate/upstream-ca.pem"
heartbeat_interval: 1h
stats_flush_interval: 60s
rule_update_interval: 6h

# Threshold webhook alerting (off by default). When alert_webhook_url is set,
# the agent POSTs a counters-only alert when DLP blocks spike past the
# threshold within a polling window. No domain names, URLs, IPs, matched
# values, or pattern names are ever sent. Point it at Slack / PagerDuty / a
# SIEM collector. Status at GET /api/alerter/status.
# alert_webhook_url: "https://hooks.example.com/prompt-gate"
alert_threshold_blocks: 10   # min 5
alert_interval: 5m
