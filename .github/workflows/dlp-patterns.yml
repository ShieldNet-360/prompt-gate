name: DLP corpus gate

# Contribution flywheel: any PR that touches DLP patterns, the engine, or the
# labelled corpus must keep the precision-first invariant — 0 false positives
# on the *_must_not_trigger corpus, and precision/recall above the floors.
# This is a focused, fast, clearly-named check so pattern contributors get an
# obvious green/red signal without reading the full CI log.
#
# The job runs on EVERY pull request so the required "Precision-first corpus
# gate" status always reports — a paths filter here would leave the required
# check stuck at "Expected — waiting for status to be reported" on PRs that
# don't touch DLP (and contributors can't dispatch it manually). Instead we
# detect scope inside the job: PRs that don't change rules/the engine have
# nothing in the corpus to re-verify, so the gate passes immediately; PRs that
# do change them run the full corpus and must stay green.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: Precision-first corpus gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect whether DLP rules or engine changed
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # workflow_dispatch is an intentional manual run — always run the corpus.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dlp=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — running full corpus." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          files=$(gh pr diff "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --name-only)
          if printf '%s\n' "$files" \
            | grep -qE '^(rules/dlp_patterns\.json$|rules/dlp_exclusions\.json$|agent/internal/dlp/)'; then
            echo "dlp=true" >> "$GITHUB_OUTPUT"
          else
            echo "dlp=false" >> "$GITHUB_OUTPUT"
            {
              echo '## DLP corpus gate'
              echo '_No DLP rules or engine files changed — corpus unchanged, gate passes._'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: steps.scope.outputs.dlp == 'true'
        with:
          go-version-file: agent/go.mod
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Run FP + accuracy corpus
        if: steps.scope.outputs.dlp == 'true'
        working-directory: agent
        run: |
          set -o pipefail
          go test ./internal/dlp/ -run 'TestFPCorpus|TestDLPAccuracyCorpus' -v \
            | tee /tmp/corpus.log

      - name: Summarise into the job summary
        if: steps.scope.outputs.dlp == 'true' && always()
        run: |
          {
            echo '## DLP corpus gate'
            echo '```'
            grep -E 'Precision|Recall|F1|FP rate|Totals|FP \[' /tmp/corpus.log || true
            echo '```'
            echo '_The must-not-trigger corpus must stay at 0 false positives. '
            echo 'Add positive samples to `*_must_trigger.txt` and any safe-looking '
            echo 'forms to `*_must_not_trigger.txt` when contributing a pattern._'
          } >> "$GITHUB_STEP_SUMMARY"
