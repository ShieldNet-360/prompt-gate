name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-agent:
    name: Agent (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          # Windows agent is bundled inside the Electron portable ZIP
          # and MSI installer (build-electron job) — no standalone exe.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: agent/go.mod
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Build agent
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          out="dist/prompt-gate-agent-${GOOS}-${GOARCH}${{ matrix.ext }}"
          # Reproducible build: -trimpath strips local paths, -buildvcs=false
          # drops the embedded VCS stamp so the binary is a pure function of
          # (source content + toolchain + GOOS/GOARCH). Anyone can reproduce
          # it bit-for-bit with scripts/reproduce-agent.sh. The commit is still
          # bound to the artifact via SLSA provenance (attest-build-provenance).
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$out" ./cmd/agent
          echo "Built $out"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: agent/dist/prompt-gate-agent-*
          if-no-files-found: error

  # Independently rebuilds every agent binary in a clean runner and asserts
  # the SHA-256 matches what build-agent produced. A green check here is
  # machine-checkable proof that the published binaries are reproducible from
  # source alone — the link that lets anyone tie the audited source (and its
  # passing privacy test) to the exact bytes they run. See docs/reproducible-builds.md.
  verify-reproducible-agent:
    name: Verify reproducible agent build
    runs-on: ubuntu-latest
    needs: [build-agent]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: agent/go.mod
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Download build-agent artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.8
        with:
          pattern: agent-*
          path: published
          merge-multiple: true

      - name: Rebuild and compare
        working-directory: agent
        run: |
          set -euo pipefail
          rc=0
          rebuild() {
            local goos="$1" goarch="$2" ext="${3:-}"
            local name="prompt-gate-agent-${goos}-${goarch}${ext}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "/tmp/${name}" ./cmd/agent
            local want have
            want=$(sha256sum "../published/${name}" | awk '{print $1}')
            have=$(sha256sum "/tmp/${name}"        | awk '{print $1}')
            if [ "$want" = "$have" ]; then
              echo "OK   ${name}  ${have}"
            else
              echo "DIFF ${name}  published=${want}  rebuilt=${have}"; rc=1
            fi
          }
          rebuild linux   amd64
          rebuild linux   arm64
          rebuild darwin  amd64
          rebuild darwin  arm64
          # Windows agent is not built standalone; it ships inside
          # the Electron portable ZIP / MSI installer.
          exit $rc

  build-electron:
    name: Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: npm ci
        working-directory: electron
        run: npm ci

      - name: Sync version from git tag
        working-directory: electron
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Setting electron package version to ${TAG}"
          npm version "${TAG}" --no-git-tag-version --allow-same-version

      - name: build renderer + main
        working-directory: electron
        run: npm run build

      # Bundle the agent binary + rules INTO the app so the tray can
      # auto-start the agent — the user never runs a separate process.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: agent/go.mod

      - name: Bundle agent + helper + rules into the app
        shell: bash
        run: |
          mkdir -p electron/resources/bin
          agent_out="electron/resources/bin/prompt-gate-agent"
          helper_out="electron/resources/bin/prompt-gate-proxy-helper"
          [ "${{ runner.os }}" = "Windows" ] && agent_out="${agent_out}.exe"
          [ "${{ runner.os }}" = "Windows" ] && helper_out="${helper_out}.exe"
          (cd agent && go build -trimpath -ldflags "-s -w" -o "../${agent_out}" ./cmd/agent)
          # proxy-helper is macOS-only; skip on other platforms
          if [ "${{ runner.os }}" = "macOS" ]; then
            (cd agent && go build -trimpath -ldflags "-s -w" -o "../${helper_out}" ./cmd/proxy-helper)
          fi
          rm -rf electron/resources/rules
          cp -R rules electron/resources/rules
          # Stage Linux-specific files (PolicyKit policy) for the deb/rpm build.
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p electron/resources/linux
            cp scripts/linux/com.shieldnet360.promptgate.policy electron/resources/linux/
          fi

      - name: electron-builder
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-${{ matrix.os }}
          path: |
            electron/release/*.dmg
            electron/release/*.deb
            electron/release/*.rpm
            electron/release/*.AppImage
            electron/release/*.msi
            electron/release/*.zip
            electron/release/*.yml
            electron/release/*.blockmap
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: [build-agent, build-electron]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # keyless Sigstore signing (OIDC)
      attestations: write # store the build-provenance attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artefacts

      - name: flatten artefacts
        run: |
          mkdir -p release
          find artefacts -type f \( -name '*.pkg' -o -name '*.msi' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.exe' \
            -o -name '*.zip' \
            -o -name '*.yml' -o -name '*.blockmap' \) -exec cp {} release/ \;
          ls -la release/

      # CycloneDX SBOM for the agent — the binary's real dependency graph.
      # Included in SHA256SUMS, attested, and published as a release asset.
      - name: Checkout source (for SBOM)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/agent/go.mod
          cache: true
          cache-dependency-path: src/agent/go.sum

      - name: Generate CycloneDX SBOM (agent)
        working-directory: src/agent
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          "$(go env GOPATH)/bin/cyclonedx-gomod" app -json -licenses -main ./cmd/agent \
            -output "${GITHUB_WORKSPACE}/release/prompt-gate-agent.cyclonedx.json" .
          ls -la "${GITHUB_WORKSPACE}/release/prompt-gate-agent.cyclonedx.json"

      - name: Generate checksums
        working-directory: release
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      # Sigstore-backed SLSA build provenance for every release artifact.
      # Keyless (Fulcio/Rekor via OIDC) — no signing secrets required.
      # Verify with: gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'release/*'

      - name: Publish release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
